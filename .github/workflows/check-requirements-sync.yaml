---
name: Check requirements.in sync

on: # yamllint disable-line rule:truthy
  push:
    paths:
      - Dockerfile
      - requirements.in
      - requirements.txt
  pull_request:
    paths:
      - Dockerfile
      - requirements.in
      - requirements.txt
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    name: requirements.in matches upstream tarball
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check requirements.in matches upstream
        run: ./scripts/check-requirements-sync.sh

  lockfile:
    name: requirements.txt matches a clean resolve
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Check requirements.txt matches a clean resolve
        run: ./scripts/check-lockfile.sh
