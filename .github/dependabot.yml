---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # AceStream engine ships prebuilt cp310 wheels/eggs and compiled
      # extensions, so the base image must stay on Python 3.10 until they
      # update.
      - dependency-name: "library/python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
