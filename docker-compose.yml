---
services:
  app:
    build: .
    ports:
      - '6878:6878'
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:6878/webui/api/service?method=get_version
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      - ALLOW_REMOTE_ACCESS=no # change to "yes" to allow internet access
      # add any extra command line option mentioned in https://docs.acestream.net/developers/engine-command-line-options/
      - EXTRA_FLAGS=--cache-dir /root/.ACEStream/cache --cache-limit 1
